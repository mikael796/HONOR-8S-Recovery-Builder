name: Recovery Build 12.1

on:
  workflow_dispatch:

env:
  MANIFEST_BRANCH: "12.1"
  MANIFEST_TREE: "aosp"
  DEVICE_TREE_URL: "https://github.com/mikael796/android_device_huawei_honor8s"
  DEVICE_TREE_BRANCH: "android-12.1"
  DEVICE_PATH: "device/huawei/honor8s"
  DEVICE_NAME: "honor8s"
  PRODUCT_PREFIX: "twrp"
  BUILD_TARGET: "recovery"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Display Build Configuration
      run: |
        echo "::group::Build Configuration"
        echo "Manifest: twrp-${MANIFEST_BRANCH} (aosp, native EROFS)"
        echo "Device Tree: ${DEVICE_TREE_URL} (${DEVICE_TREE_BRANCH})"
        echo "Device Path: ${DEVICE_PATH}"
        echo "Product: ${PRODUCT_PREFIX}_${DEVICE_NAME}"
        echo "Output: recovery.img + repacked recovery_ramdisk.img (Huawei flashable)"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-${MANIFEST_BRANCH}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${DEVICE_TREE_URL} -b ${DEVICE_TREE_BRANCH} ./${DEVICE_PATH}
      working-directory: workspace

    - name: Install Python 2
      run: |
        sudo apt -y install python2 || true
        if [ -f /usr/bin/python2 ]; then
          cd /usr/bin
          sudo ln -sf python2 python
        fi

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${PRODUCT_PREFIX}_${DEVICE_NAME}-eng && make ${BUILD_TARGET}image -j$(nproc --all)
      working-directory: workspace

    - name: Repack for Huawei recovery_ramdisk
      run: |
        python3 ${DEVICE_PATH}/repack_huawei_recovery.py \
          out/target/product/${DEVICE_NAME}/${BUILD_TARGET}.img \
          out/target/product/${DEVICE_NAME}/recovery_ramdisk.img
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery_ramdisk.img
        name: HONOR 8S (TWRP 12.1, native EROFS)
        tag_name: twrp121-${{ github.run_id }}
        body: |
          TWRP for HONOR 8S (MT6761) — twrp-12.1 (aosp)

          Native EROFS support: system/vendor/product/odm/cust/version
          mount and unmount from the GUI.

          FLASH INSTRUCTIONS:
          - recovery_ramdisk.img — flash this to the recovery_ramdisk partition
            (dd if=recovery_ramdisk.img of=/dev/block/platform/bootdevice/by-name/recovery_ramdisk)
          - recovery.img — full boot image for fastboot boot testing only.
            Do NOT flash to boot!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
